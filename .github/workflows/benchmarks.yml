name: Benchmark performance
on:
  workflow_dispatch:

permissions:
  contents: write
 
jobs:
  benchmark:
    name: Run KX.FileHash.Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build -c Release --no-restore

      - name: Run benchmark
        run: dotnet run --project ./KZ.FileHash.Benchmarks/KZ.FileHash.Benchmarks.csproj -c Release -f net10.0 --exporters json --filter '*'

      - name: Store benchmark result
        uses: rhysd/github-action-benchmark@v1
        with:
          name: KZ.FileHash Benchmark
          tool: 'benchmarkdotnet'
          output-file-path: BenchmarkDotNet.Artifacts/results/KZ.FileHash-report-full-compressed.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          # Show alert with commit comment on detecting possible performance regression
          alert-threshold: '200%'
          comment-on-alert: true
          fail-on-alert: true
          alert-comment-cc-users: '@ktrz'

      # - name: Store benchmark result - separate results repo
      #   uses: rhysd/github-action-benchmark@v1
      #   with:
      #     name: KZ.FileHash Benchmark
      #     tool: 'benchmarkdotnet'
      #     output-file-path: Benchmarks/results/KZ.FileHash-report-full-compressed.json
