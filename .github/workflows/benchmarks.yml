name: Performance Benchmarks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0'  # كل يوم أحد منتصف الليل
  workflow_dispatch:     # تشغيل يدوي من تبويب Actions

jobs:
  benchmark:
    name: Run Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 60   # حد أقصى 60 دقيقة
    
    permissions:
      contents: write     # لتحديث README (اختياري)
      pull-requests: write
      actions: read

    steps:
      # 1. تحميل الكود من المستودع
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. إعداد .NET SDK مع كل الإصدارات المدعومة
      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      # 3. استعادة الحزم
      - name: Restore dependencies
        run: dotnet restore

      # 4. بناء المشروع في وضع Release
      - name: Build solution
        run: dotnet build -c Release --no-restore

      # 5. تشغيل الـ Benchmarks على كل الإصدارات
      - name: Run benchmarks (All Runtimes)
        run: |
          mkdir -p benchmark-results
          
          # تشغيل على .NET 8
          echo "=== Running on .NET 8.0 ==="
          dotnet run --project KZ.FileHash.Benchmarks/KZ.FileHash.Benchmarks.csproj -c Release -f net8.0 \
            --filter "*" \
            --exporters Markdown \
            --artifacts ./benchmark-results/net8.0

          # تشغيل على .NET 9
          echo "=== Running on .NET 9.0 ==="
          dotnet run --project KZ.FileHash.Benchmarks/KZ.FileHash.Benchmarks.csproj -c Release -f net9.0 \
            --filter "*" \
            --exporters Markdown \
            --artifacts ./benchmark-results/net9.0

          # تشغيل على .NET 10
          echo "=== Running on .NET 10.0 ==="
          dotnet run --project KZ.FileHash.Benchmarks/KZ.FileHash.Benchmarks.csproj -c Release -f net10.0 \
            --filter "*" \
            --exporters Markdown \
            --artifacts ./benchmark-results/net10.0

      # 6. عرض قائمة الملفات المُنشأة
      - name: List generated reports
        run: ls -la benchmark-results/*/

      # 7. رفع النتائج كـ Artifacts (للتحميل اليدوي)
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-reports
          path: benchmark-results/**/*.md
          retention-days: 30

      # 8. (اختياري) تحديث README آلياً
      - name: Update README with latest results
        run: |
          # استخرج جدول النتائج من أحدث تقرير (من .NET 10)
          REPORT_FILE=$(ls -t benchmark-results/net10.0/*-report-github.md 2>/dev/null | head -1)
          
          if [ -f "$REPORT_FILE" ]; then
            echo "Found report: $REPORT_FILE"
            
            # استخرج جدول النتائج
            START=$(grep -n "| Method" "$REPORT_FILE" | head -1 | cut -d: -f1)
            if [ -n "$START" ]; then
              END=$(tail -n +$START "$REPORT_FILE" | grep -n "^$" | head -1 | cut -d: -f1)
              if [ -z "$END" ]; then
                END=$(wc -l < "$REPORT_FILE")
              else
                END=$((START + END - 1))
              fi
              
              TABLE=$(sed -n "${START},${END}p" "$REPORT_FILE")
              
              # عدّل README.md
              if [ -f "README.md" ]; then
                # حذف القسم القديم بين العلامات
                sed -i '/<!-- BENCHMARK-START -->/,/<!-- BENCHMARK-END -->/d' README.md
                
                # إضافة القسم الجديد
                cat >> README.md << 'EOF'
            
            <!-- BENCHMARK-START -->
            ## 📊 Performance Benchmarks
            
            *Automatically updated on: $(date -u +"%Y-%m-%d %H:%M UTC")*
            
            $(echo "$TABLE")
            
            > **Memory usage comparison:** KZ.FileHash uses up to 99.9% less memory than traditional methods.
            <!-- BENCHMARK-END -->
            EOF
              fi
            fi
          fi
        shell: bash

      # 9. (اختياري) إيداع التغييرات في README
      - name: Commit and push README changes
        if: github.event_name == 'push'  # يشغل فقط عند الـ Push
        run: |
          if git diff --quiet README.md; then
            echo "No changes to README.md"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "docs: update benchmark results [skip ci]"
            git push
          fi
